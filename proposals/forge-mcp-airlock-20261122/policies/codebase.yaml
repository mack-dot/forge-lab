# Domain 1: codebase lockdown. The agent works on public code around hidden code.
# Upstream "fs" is the REAL off-the-shelf @modelcontextprotocol/server-filesystem 2.2.0.
# Upstream "repo" is a mock that adds content search and git tools (the real server has none).
version: 1
upstreams:
  - name: fs
    transport: stdio
    command: [node, /opt/mcpfs/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js, /ws]
    user: 1000
  - name: repo
    transport: stdio
    command: [python3, -I, /forge/mocks/mock_repo_mcp.py, --root, /ws, --git-dir, /state/filtered.git]
    user: 1000
    env:
      REPO_TOKEN: FAKE_repo_token_DEMO_ONLY_not_real_0002
tools:
  allow:
    - {tool: read_text_file, upstream: fs, path_args: {path: read}}
    - {tool: read_file, upstream: fs, path_args: {path: read}}
    - {tool: read_multiple_files, upstream: fs, path_args: {paths: read}}
    - {tool: list_directory, upstream: fs, path_args: {path: read}}
    - {tool: directory_tree, upstream: fs, path_args: {path: read}}
    - {tool: search_files, upstream: fs, path_args: {path: read}}
    - {tool: get_file_info, upstream: fs, path_args: {path: read}}
    - {tool: write_file, upstream: fs, path_args: {path: write}}
    - {tool: edit_file, upstream: fs, path_args: {path: write}}
    - {tool: create_directory, upstream: fs, path_args: {path: write}}
    - tool: search
      upstream: repo
      path_args: {path: read}
      arg_rules:
        query: {type: string, regex: "[^\\n]{1,200}"}
    - {tool: git_log, upstream: repo}
    - {tool: git_show, upstream: repo, path_args: {spec: git_revpath}}
  deny: [move_file, delete_path]
  # Offered upstream but not listed (default deny): copy_file, append_file, read_media_file,
  # list_directory_with_sizes, list_allowed_directories, push_branch, repo's own file tools.
paths:
  hidden_paths: ["src/proprietary/**", "**/algo.ts", ".env*"]
  readonly_paths: ["tests/**", "spec/**", ".forge/**"]
